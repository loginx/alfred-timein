name: CI Pipeline

on:
  push:
    branches: [main, dev]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Golden tests (offline + live OSM/Apple lookups)
        run: make smoke

  release:
    name: Create Release
    runs-on: macos-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            COUNT=$(git rev-list --count HEAD)
            SHA=$(git rev-parse --short HEAD)
            VERSION="v0.0.0-beta.${COUNT}+${SHA}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Generate changelog (for stable releases)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Read changelog
        if: startsWith(github.ref, 'refs/tags/v')
        id: read_changelog
        run: |
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          cat CHANGES.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Update plist version
        run: plutil -replace version -string "${{ steps.version.outputs.version }}" info.plist

      - name: Create Alfred workflow
        run: |
          make alfredworkflow
          if [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            mv TimeIn.alfredworkflow TimeIn-${{ steps.version.outputs.version }}.alfredworkflow
          fi

      - name: Create stable release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "alfred-timein v${{ steps.version.outputs.version }}"
          body: |
            A reliable Alfred workflow for timezone lookups and time conversion.

            ## What's Changed

            ${{ steps.read_changelog.outputs.changelog }}

            ## Installation

            Download TimeIn.alfredworkflow and open with Alfred.

            ## Command line

            The workflow's `timein.js` doubles as a CLI: `osascript -l JavaScript timein.js tokyo`
          files: TimeIn.alfredworkflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create beta release
        if: github.ref == 'refs/heads/dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "alfred-timein ${{ steps.version.outputs.version }}"
          body: |
            Beta release from the dev branch for testing new features.

            WARNING: This is not a stable release. Use at your own risk.

            ## Installation

            Download TimeIn-${{ steps.version.outputs.version }}.alfredworkflow and open with Alfred.

            Build: ${{ github.sha }}
          files: TimeIn-${{ steps.version.outputs.version }}.alfredworkflow
          prerelease: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
