name: CI Pipeline

on:
  push:
    branches: [main, dev]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compat:
    name: Offline tests (oldest macOS)
    runs-on: macos-15 # oldest GitHub-hosted macOS still supported; bump when it's retired
    steps:
      - uses: actions/checkout@v4
      - run: make test

  ci:
    name: Test & Release
    needs: compat
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release versioning and changelog read history and tags

      - name: Syntax ceiling (ES2020)
        run: make lint

      - name: Offline tests (unit + golden)
        run: make test

      - name: Live lookups (OpenStreetMap, Apple)
        run: make live

      # Version tags publish stable releases, dev pushes publish betas; everything else stops after the tests.
      - name: Plan release
        id: release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/dev'
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            tag=$GITHUB_REF_NAME
            version=${tag#v}
            range=--latest
            prerelease=false
            file=TimeIn.alfredworkflow
            intro="A reliable Alfred workflow for timezone lookups and time conversion."
          else
            tag=v0.0.0-beta.$(git rev-list --count HEAD)+$(git rev-parse --short HEAD)
            version=$tag
            range=--unreleased
            prerelease=true
            file=TimeIn-$tag.alfredworkflow
            intro="Beta from dev ($GITHUB_SHA), not a stable release: use at your own risk."
          fi
          printf '%s\n' "tag=$tag" "version=$version" "range=$range" "prerelease=$prerelease" "file=$file" "intro=$intro" | tee -a "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        if: steps.release.outcome == 'success'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: ${{ steps.release.outputs.range }} --strip header
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Package workflow
        if: steps.release.outcome == 'success'
        run: |
          plutil -replace version -string "${{ steps.release.outputs.version }}" info.plist
          make alfredworkflow OUT="${{ steps.release.outputs.file }}"

      - name: Publish release
        if: steps.release.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: alfred-timein ${{ steps.release.outputs.tag }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          files: ${{ steps.release.outputs.file }}
          body: |
            ${{ steps.release.outputs.intro }}

            ## What's Changed

            ${{ steps.changelog.outputs.content }}

            ## Installation

            Download `${{ steps.release.outputs.file }}` and open it with Alfred.

            ## Command line

            The workflow's `timein.js` doubles as a CLI: `osascript -l JavaScript timein.js tokyo`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
